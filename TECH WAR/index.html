<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EMI Calculator</title>
<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">
  <div class="left">
    <h2>EMI Calculator</h2>

    <div class="input-group">
      <label>Loan Amount</label>
      <input type="range" id="amount" min="100000" max="5000000" step="50000" value="1000000">
      <input type="number" id="amountVal" value="1000000">
    </div>




    <div class="input-group">
      <label>Interest Rate (%)</label>
      <input type="range" id="rate" min="1" max="15" step="0.1" value="9">
      <input type="number" id="rateVal" value="9">
    </div>

    <div class="input-group">
      <label>Loan Term (Years)</label>
      <input type="range" id="years" min="1" max="30" value="5">
      <input type="number" id="yearsVal" value="5">
    </div>
  </div>

  <div class="right">
    <div class="donut" id="donut">
      <span id="totalAmount">₹0</span>
    </div>

    <div class="result">
      <p><b>Monthly EMI:</b> ₹<span id="emi">0</span></p>
      <p><b>Principal:</b> ₹<span id="principal">0</span></p>
      <p><b>Interest:</b> ₹<span id="interest">0</span></p>
    </div>
  </div>
</div>


<script src="script.js"></script>
</body>
</html>
